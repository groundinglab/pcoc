[workspace]
resolver = "2"
members = ["core", "app"]

[workspace.package]
version = "0.1.6"
edition = "2021"
rust-version = "1.83"
publish = false

[workspace.dependencies]
# The Rust SDK 2.3, in-tree at sdk/rust. Package `pcoc` follows sdk/VERSION.
# About shows the resolved version and pin (core/build.rs reads Cargo.lock).
pcoc = { path = "../../sdk/rust/pcoc" }
pcoc-produce = { path = "../../sdk/rust/pcoc-produce" }

base64 = "0.22"
bech32 = "=0.9.1"
getrandom = "0.2"
secp256k1 = { version = "=0.29.1", default-features = false, features = ["std", "alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "0.10"
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
zeroize = "=1.8.2"
# Send to my phone: NIP-04 (AES-256-CBC) and Nostr relays over TLS websockets.
aes = "=0.8.4"
cbc = { version = "=0.1.2", features = ["alloc"] }
tungstenite = { version = "=0.26.2", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }

[profile.dev.package."*"]
# Legs, scrypt (NIP-49 log_n 16) and the six-leg recompute are unusable unoptimised.
opt-level = 3

[profile.release]
lto = "thin"
