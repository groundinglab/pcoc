[workspace]
resolver = "2"
members = ["core", "app"]

[workspace.package]
version = "0.1.2"
edition = "2021"
rust-version = "1.83"
publish = false

[workspace.dependencies]
# The Rust reference (Satoshi Hike v2.0), pinned to a release tag.
hike = { git = "https://github.com/groundinglab/pcoc", tag = "ref-rust-v2.0.4" }

base64 = "0.22"
bech32 = "=0.9.1"
getrandom = "0.2"
secp256k1 = { version = "=0.29.1", default-features = false, features = ["std", "alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "0.10"
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
zeroize = "=1.8.2"

[profile.dev.package."*"]
# Legs, scrypt (NIP-49 log_n 16) and the six-leg recompute are unusable unoptimised.
opt-level = 3

[profile.release]
lto = "thin"
