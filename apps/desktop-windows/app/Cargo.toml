[package]
name = "pcoc-windows"
description = "PCOC Windows one-screen producer. egui window on pcoc-windows-core."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["gui"]
gui = ["dep:eframe"]

[dependencies]
pcoc-windows-core = { path = "../core" }
pcoc.workspace = true
pcoc-produce.workspace = true
getrandom.workspace = true
serde_json.workspace = true
zeroize.workspace = true
eframe = { version = "=0.31.1", optional = true, default-features = false, features = ["default_fonts", "glow"] }

[[bin]]
name = "pcoc-windows"
path = "src/main.rs"
required-features = ["gui"]
