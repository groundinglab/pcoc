[workspace]
resolver = "2"
members = ["core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
# Rust SDK 2.3.1, in-tree at sdk/rust. Package `pcoc` follows sdk/VERSION.
pcoc = { path = "../../sdk/rust/pcoc" }
pcoc-produce = { path = "../../sdk/rust/pcoc-produce" }

bech32 = "=0.9.1"
getrandom = "0.2"
secp256k1 = { version = "=0.29.1", default-features = false, features = ["std", "alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "0.10"
zeroize = "=1.8.2"

[profile.dev.package."*"]
# Legs on the conformance-small profile are unusable unoptimised.
opt-level = 3

[profile.release]
lto = "thin"
