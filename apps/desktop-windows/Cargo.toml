[workspace]
resolver = "2"
members = ["core", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
# Rust SDK 2.3.1, in-tree at sdk/rust. Package `pcoc` follows sdk/VERSION.
pcoc = { path = "../../sdk/rust/pcoc" }
pcoc-produce = { path = "../../sdk/rust/pcoc-produce" }

aes = "=0.8.4"
base64 = "0.22"
bech32 = "=0.9.1"
cbc = { version = "=0.1.2", features = ["alloc"] }
getrandom = "0.2"
secp256k1 = { version = "=0.29.1", default-features = false, features = ["std", "alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "0.10"
tungstenite = { version = "=0.26.2", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
zeroize = "=1.8.2"

[profile.dev.package."*"]
# Legs on the conformance-small profile are unusable unoptimised.
opt-level = 3

[profile.release]
lto = "thin"
