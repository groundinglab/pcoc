[package]
name = "pcoc-produce"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Satoshi Hike 2.3 producer: scripted rig and live hike"

[dependencies]
pcoc = { path = "../pcoc" }
pcoc-gossip = { path = "../pcoc-gossip" }
# Plain HTTP. No secret is sent. Same pin the desktop app already builds.
# The lock keeps idna_adapter 1.1 (unicode-rs backend), rustls 0.23.45,
# smallvec 1.16.2, and unicode-normalization 0.1.25, matching the service
# locks. idna_adapter 1.2 pulls icu, which an offline build cannot fetch.
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
