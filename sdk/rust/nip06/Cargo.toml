[package]
name = "nip06"
version = "2.0.0-rc.1"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.83"
publish = false
description = "DEMO keys: BIP-39 English 12-word, empty passphrase, NIP-06 path, BIP-340 x-only. nsec and npub are NIP-19 clothing."

[dependencies]
bech32 = "=0.9.1"
bip39 = "=2.0.0"
getrandom = "=0.2.15"
hmac = "=0.12.1"
secp256k1 = { version = "=0.29.1", default-features = false, features = ["std", "alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.8"
zeroize = "=1.8.2"
