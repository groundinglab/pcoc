# CI for groundinglab/pcoc. Heavy suites run on the self-hosted RS2 pool (label pcoc-heavy,
# local persistent caches). Light checks run on standard GitHub-hosted ubuntu-latest, which is
# free for this public repo (Christian, 23 Oct 2026). Jobs never run for fork PRs (fork guard in
# every job + runner pre-job hook on the self-hosted pool).
# `ci-ok` is the single check to require. Suites are path-gated by .github/scripts/changes.sh;
# a suite whose directory does not exist yet is skipped.
name: ci

# Branches carry the full suite (pull_request, heavy legs on RS2). A push to main
# gets the light watch only (hosted). The full suite reruns on main nightly
# (schedule) or on demand (workflow_dispatch), never on every merge.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 16 * * *" # 03:00 ACDT / 02:00 ACST, nightly full run on main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One live run per PR (or per ref for pushes); a newer push cancels the older PR run.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "4"

jobs:
  changes:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      spec: ${{ steps.gate.outputs.spec }}
      rust: ${{ steps.gate.outputs.rust }}
      go: ${{ steps.gate.outputs.go }}
      java: ${{ steps.gate.outputs.java }}
      c: ${{ steps.gate.outputs.c }}
      csharp: ${{ steps.gate.outputs.csharp }}
      gate: ${{ steps.gate.outputs.gate }}
      claims: ${{ steps.gate.outputs.claims }}
      bari: ${{ steps.gate.outputs.bari }}
      index: ${{ steps.gate.outputs.index }}
      desktop: ${{ steps.gate.outputs.desktop }}
      desktop_windows: ${{ steps.gate.outputs.desktop_windows }}
      docs: ${{ steps.gate.outputs.docs }}
      xverify: ${{ steps.gate.outputs.xverify }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: gate
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="" ;;
          esac
          bash .github/scripts/changes.sh "$base" HEAD | tee -a "$GITHUB_OUTPUT"

  spec:
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.changes.outputs.spec == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: sparse worktree (full clone, cone mode, no partial filter)
        run: git sparse-checkout set spec sdk
      - name: ring 1 checks (section 6, sign-in wire, links, manifest hash)
        run: python3 spec/conformance/tools/ring1_checks.py
      - name: spec pin
        working-directory: sdk/rust
        run: cargo test -p pcoc --test ac_a3 --locked -- --test-threads=6

  sdk:
    # One leg per language, in parallel on the heavy pool. A language whose
    # directory or 2.2 entry point is absent is skipped. Same path gate as before:
    # any spec or SDK change runs all five legs.
    needs: changes
    if: (github.event_name != 'push' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && (needs.changes.outputs.spec == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.java == 'true' || needs.changes.outputs.c == 'true' || needs.changes.outputs.csharp == 'true')
    strategy:
      fail-fast: false
      matrix:
        lang: [rust, go, java, c, csharp]
    name: sdk (${{ matrix.lang }})
    runs-on: [self-hosted, linux, pcoc-heavy]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: sparse worktree (full clone, cone mode, no partial filter)
        run: git sparse-checkout set spec sdk
      - id: on
        env:
          LANG_KEY: ${{ matrix.lang }}
        run: |
          case "$LANG_KEY" in
            rust) d=sdk/rust ;;
            go) d=sdk/go/cmd/pcoc ;;
            java) d=sdk/java/check ;;
            c) d=sdk/c ;;
            csharp) d=sdk/csharp ;;
          esac
          echo "run=$([[ -d $d ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: local cache dirs (runner-provided; in-tree fallback)
        if: steps.on.outputs.run == 'true'
        run: |
          # RS2 runners set PCOC_TARGET_ROOT to a per-runner persistent volume. Cargo build
          # dirs are never shared between concurrent jobs.
          if [[ -n "${PCOC_TARGET_ROOT:-}" ]]; then
            echo "CARGO_TARGET_DIR=$PCOC_TARGET_ROOT/sdk-rust" >> "$GITHUB_ENV"
            echo "PCOC_NEGATIVES_TARGET=$PCOC_TARGET_ROOT/sdk-rust-negatives" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.on.outputs.run == 'true' && matrix.lang == 'go'
        with:
          go-version-file: sdk/go/go.mod
          cache: false # no third-party modules (no go.sum); GOCACHE is a runner volume
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: steps.on.outputs.run == 'true' && matrix.lang == 'java'
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        if: steps.on.outputs.run == 'true' && matrix.lang == 'csharp'
        with:
          global-json-file: sdk/csharp/global.json
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"
      - name: Rust workspace
        if: steps.on.outputs.run == 'true' && matrix.lang == 'rust'
        working-directory: sdk/rust
        run: |
          # Release profile: the suite regenerates the production-size candidates
          # and object (sdk/rust/README.md); the debug profile overruns the job timeout.
          cargo test --workspace --locked --release -- --test-threads=4
          for script in check/*.sh; do
            [ -f "$script" ] || continue
            bash "$script"
          done
      - name: Go
        if: steps.on.outputs.run == 'true' && matrix.lang == 'go'
        working-directory: sdk/go
        run: go test ./...
      - name: Java
        if: steps.on.outputs.run == 'true' && matrix.lang == 'java'
        working-directory: sdk/java
        run: ./gradlew test
      - name: C
        if: steps.on.outputs.run == 'true' && matrix.lang == 'c'
        working-directory: sdk/c
        run: make -j4 check
      - name: C#
        if: steps.on.outputs.run == 'true' && matrix.lang == 'csharp'
        working-directory: sdk/csharp
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"
        run: |
          dotnet run --project check/Pcoc.Check -c Release
          dotnet build cli/Pcoc.Cli -c Release
          sh check/negatives.sh

  services:
    needs: changes
    if: (github.event_name != 'push' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository))
    strategy:
      fail-fast: false
      matrix:
        include:
          - { key: gate, dir: services/admission-gate }
          - { key: claims, dir: services/admission-claims }
          - { key: bari, dir: services/bari }
          - { key: index, dir: services/index }
    name: service (${{ matrix.key }})
    runs-on: [self-hosted, linux, pcoc-heavy]
    timeout-minutes: 20
    steps:
      - name: gate
        id: on
        env:
          OUTS: ${{ toJSON(needs.changes.outputs) }}
          KEY: ${{ matrix.key }}
        run: echo "run=$(jq -r --arg k "$KEY" '.[$k]' <<<"$OUTS")" >> "$GITHUB_OUTPUT"
      # Standalone build: only this service's directory is checked out.
      - if: steps.on.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.on.outputs.run == 'true'
        name: sparse worktree (full clone, cone mode, no partial filter)
        # The gate builds sdk/rust by path and reads the §15.4 policy file.
        # pack_sign_in reads spec/conformance/pack/sign-in.json and
        # sign-in-origins.json. The index builds services/bari by path.
        # Cone mode on sdk/rust also brings the files directly under sdk/
        # (VERSION, SPEC_PIN).
        run: |
          case "${{ matrix.key }}" in
            gate) git sparse-checkout set services/admission-gate sdk/rust policy spec/conformance/pack ;;
            # Bari links sdk/rust/pcoc, which include_str's sdk/VERSION and sdk/SPEC_PIN.
            bari) git sparse-checkout set services/bari sdk/rust ;;
            index) git sparse-checkout set services/index services/bari sdk/rust ;;
            *) git sparse-checkout set ${{ matrix.dir }} ;;
          esac
      - if: steps.on.outputs.run == 'true'
        name: local cache dirs (runner-provided; in-tree fallback)
        env:
          KEY: ${{ matrix.key }}
        run: |
          if [[ -n "${PCOC_TARGET_ROOT:-}" ]]; then
            echo "CARGO_TARGET_DIR=$PCOC_TARGET_ROOT/svc-$KEY" >> "$GITHUB_ENV"
          fi
      - if: steps.on.outputs.run == 'true'
        name: cargo test
        working-directory: ${{ matrix.dir }}
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo test --locked --release
      # The release binary, not the test harness. Fails when mainnet still
      # takes the absent-source arm. No dial.
      - if: steps.on.outputs.run == 'true' && matrix.key == 'bari'
        name: release binary includes the live header source
        working-directory: services/bari
        run: |
          cargo build --locked --release --bin bari
          bin="${CARGO_TARGET_DIR:-target}/release/bari"
          out="$("$bin" --self-check)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q 'bitcoin-gossip'

  desktop:
    # Not required: ci-ok ignores this job's result.
    needs: changes
    if: (github.event_name != 'push' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && needs.changes.outputs.desktop == 'true'
    runs-on: [self-hosted, linux, pcoc-heavy]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: sparse worktree (full clone, cone mode, no partial filter)
        run: git sparse-checkout set apps/desktop spec/conformance sdk/rust
      - name: GTK dev packages (preinstalled on the runner image; no sudo on self-hosted)
        run: pkg-config --modversion gtk4 libadwaita-1 || echo "::warning::gtk4/libadwaita dev packages missing on this runner image"
      - name: local cache dirs (runner-provided; in-tree fallback)
        run: |
          if [[ -n "${PCOC_TARGET_ROOT:-}" ]]; then
            echo "CARGO_TARGET_DIR=$PCOC_TARGET_ROOT/desktop" >> "$GITHUB_ENV"
          fi
      - name: cargo test core
        working-directory: apps/desktop
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo test --locked -p pcoc-hike-core

  desktop-windows:
    needs: changes
    if: (github.event_name != 'push' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && needs.changes.outputs.desktop_windows == 'true'
    runs-on: [self-hosted, linux, pcoc-heavy]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: sparse worktree (full clone, cone mode, no partial filter)
        run: git sparse-checkout set apps/desktop-windows sdk spec
      - name: local cache dirs (runner-provided; in-tree fallback)
        run: |
          if [[ -n "${PCOC_TARGET_ROOT:-}" ]]; then
            echo "CARGO_TARGET_DIR=$PCOC_TARGET_ROOT/desktop-windows" >> "$GITHUB_ENV"
          fi
      - name: cargo test core and window logic
        working-directory: apps/desktop-windows
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          cargo test --locked -p pcoc-windows-core
          cargo test --locked -p pcoc-windows --no-default-features

  docs:
    needs: changes
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: relative link check
        run: python3 .github/scripts/doclinks.py

  gitleaks:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks 8.30.1 on the checked-out ref (digest-pinned image)
        run: |
          # Official image already runs: git config --global --add safe.directory '*'
          image=ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          pulled=0
          for attempt in 1 2 3; do
            if docker pull "$image"; then
              pulled=1
              break
            fi
            echo "docker pull failed (attempt ${attempt}/3)" >&2
            if [[ "$attempt" -lt 3 ]]; then
              sleep 3
            fi
          done
          if [[ "$pulled" -ne 1 ]]; then
            echo "::error::pinned gitleaks image pull failed after 3 attempts" >&2
            exit 1
          fi
          docker run --rm -v "$PWD:/repo" -w /repo "$image" git --redact -v /repo

  g1:
    # Fork PRs get no secrets, so G1 cannot run there; ci-ok accepts a skip only in that case.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ripgrep from the Ubuntu archive
        run: |
          command -v rg && exit 0
          # Signed distro package. Bounded retry: 6 attempts, 3s apart
          # (same bound as the previous curl --retry 5).
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sudo apt-get update && sudo apt-get install -y ripgrep; then
              ok=1
              break
            fi
            echo "apt-get install ripgrep failed (attempt ${attempt}/6)" >&2
            if [[ "$attempt" -lt 6 ]]; then
              sleep 3
            fi
          done
          if [[ "$ok" -ne 1 ]]; then
            echo "::error::ripgrep install from the Ubuntu archive failed after 6 attempts" >&2
            exit 1
          fi
      - name: G1 leak grep (blocking); name spelling (advisory)
        env:
          G1_PATTERNS: ${{ secrets.G1_PATTERNS }}
        run: bash .github/scripts/g1.sh

  xverify:
    # Cross-SDK verify. The harness lives at sdk/conformance/cross-verify.sh
    # (written by the conformance job). sdk/conformance absent => changes.sh
    # reports xverify=false and a pull request skips this job. Push to main
    # skips it (light watch); the nightly schedule and workflow_dispatch run it.
    needs: changes
    if: (github.event_name != 'push' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && (needs.changes.outputs.xverify == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, linux, pcoc-heavy]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: sparse worktree (full clone, cone mode, no partial filter)
        run: git sparse-checkout set sdk spec
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sdk/go/go.mod
          cache: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21" # sdk/java compiles with release 21
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: sdk/csharp/global.json
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"
      - name: cross-verify pr tier
        run: bash sdk/conformance/cross-verify.sh --tier pr

  retired-term:
    # Editorial terminology (the word "walk" in prose). The job still runs.
    # Hits are warnings and exit 0. ci-ok does not require this job.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ripgrep from the Ubuntu archive
        run: |
          command -v rg && exit 0
          # Signed distro package. Bounded retry: 6 attempts, 3s apart
          # (same bound as the previous curl --retry 5).
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if sudo apt-get update && sudo apt-get install -y ripgrep; then
              ok=1
              break
            fi
            echo "apt-get install ripgrep failed (attempt ${attempt}/6)" >&2
            if [[ "$attempt" -lt 6 ]]; then
              sleep 3
            fi
          done
          if [[ "$ok" -ne 1 ]]; then
            echo "::error::ripgrep install from the Ubuntu archive failed after 6 attempts" >&2
            exit 1
          fi
      - name: retired-term check (advisory; exact-line allowlist)
        run: python3 .github/scripts/retired-term-prose.py

  ci-ok:
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: [changes, spec, sdk, services, desktop, desktop-windows, docs, gitleaks, g1, retired-term, xverify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: sparse worktree (full clone, cone mode, no partial filter)
        run: git sparse-checkout set .github/workflows
      - name: missing-job guard (needs == every other job)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, re
          # job ids are the 2-space-indented keys under the top-level jobs: map (no PyYAML needed)
          body = open(".github/workflows/ci.yml").read().split("\njobs:\n", 1)[1]
          jobs = set(re.findall(r"^  ([A-Za-z0-9_-]+):\s*$", body, re.M)) - {"ci-ok"}
          needs = set(json.loads(os.environ["NEEDS"]))
          missing, extra = sorted(jobs - needs), sorted(needs - jobs)
          if missing or extra:
              raise SystemExit(f"ci-ok needs drift: missing={missing} extra={extra}")
          print(f"guard ok: {len(jobs)} jobs")
          PY
      - name: aggregate
        env:
          NEEDS: ${{ toJSON(needs) }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ["NEEDS"])
          bad = []
          if needs["changes"]["result"] != "success":
              bad.append(f"changes={needs['changes']['result']}")
          # Blocking scans must succeed. g1 may be skipped only on a fork PR.
          # retired-term is editorial and must not fail ci-ok (same as desktop).
          fork = os.environ.get("FORK_PR") == "true"
          for name in ("gitleaks", "g1"):
              r = needs[name]["result"]
              if r == "skipped" and name == "g1" and fork:
                  print("g1: skipped on fork PR (accepted)")
              elif r != "success":
                  bad.append(f"{name}={r}")
          advisory = {"desktop", "retired-term"}
          for name, job in needs.items():
              r = job["result"]
              print(f"{name}: {r}")
              if name not in advisory and r in ("failure", "cancelled"):
                  bad.append(f"{name}={r}")
          if bad:
              raise SystemExit("ci-ok FAIL: " + ", ".join(bad))
          print("ci-ok: all required jobs passed or were skipped")
          PY
