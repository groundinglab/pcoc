[package]
name = "admission-claims"
version = "0.1.0"
edition = "2021"
# quinn-proto >= 0.11.15 declares rust-version 1.85. That is this crate's floor.
rust-version = "1.85"
license = "Apache-2.0"
publish = false
description = "groundinglab admission claims. One badge per admitted npub."

[lib]
name = "admission_claims"
path = "src/lib.rs"

[[bin]]
name = "admission-claims"
path = "src/main.rs"

[dependencies]
age = "=0.11.5"
# rust-embed 8.12+ pulls sha2 0.11, and sha2 0.11.1 needs Rust 1.88.
# age uses rust-embed for its language catalogs. These pins stay on sha2 0.10
# so rust-version can stay 1.85, which is what quinn-proto 0.11.19 declares.
rust-embed = "=8.11.0"
rust-embed-impl = "=8.11.0"
rust-embed-utils = "=8.11.0"
axum = "0.8"
bech32 = "=0.9.1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hex = "0.4"
hmac = "0.12"
nix = { version = "0.29", default-features = false, features = ["fs"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
# url 2.5.2 pulls idna 0.5 (GHSA-h97m-ww89-6jmq). url 2.5.4+ pulls idna 1.
# idna_adapter 1.1 keeps the unicode-rs backend. Adapter 1.2 pulls icu 2,
# and current icu_normalizer needs Rust 1.86 or newer.
url = "2.5.4"
idna_adapter = "=1.1.0"
# The lock carried quinn-proto 0.11.14 (GHSA-4w2j-m93h-cj5j).
# The assembler bypass (GHSA-qfwj-vfxf-92j2) is fixed in 0.11.17.
# 0.11.19 is the latest 0.11 and declares rust-version 1.85.
quinn-proto = ">=0.11.17, <0.12"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
secp256k1 = { version = "0.29.1", default-features = false, features = ["std", "alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }
zeroize = { version = "1.8", features = ["alloc"] }

[dev-dependencies]
axum = "0.8"
hex = "0.4"
http-body-util = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
secp256k1 = { version = "0.29.1", default-features = false, features = ["std", "alloc"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
