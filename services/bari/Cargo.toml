[package]
name = "pcoc-bari"
version = "0.6.8"
edition = "2021"
rust-version = "1.83"
license = "Apache-2.0"
publish = false
description = "Waypoint POST and path GET. Writes the portable-index cache and does not serve GET /index."

[lib]
name = "pcoc_bari"
path = "src/lib.rs"

[[bin]]
name = "bari"
path = "src/main.rs"

[dependencies]
axum = "0.8"
hex = "0.4"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
ureq = { version = "=2.12.1", features = ["json"] }
# url 2.5.4+ pulls idna 1 (GHSA-h97m-ww89-6jmq fix). The lock pins idna_adapter 1.1 so the build stays on rustc 1.83. Newer zeroize needs edition 2024.
url = "2.5.4"
zeroize = "=1.8.2"
hashbrown = "=0.15.5"
subtle = "=2.5.0"
# 0.1.21 needs rustc 1.85. 0.1.20 is the last 0.1 that this toolchain can parse.
hyper-util = "=0.1.20"
# 3.25+ can pull getrandom 0.4 (edition 2024). 3.24 still has TempDir::keep and getrandom 0.3.
tempfile = "=3.24.0"
# SPEC §13.1 Hashcash. The SDK has no header-source dependency.
pcoc = { path = "../../sdk/rust/pcoc" }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[dev-dependencies]
