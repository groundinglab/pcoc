[package]
name = "pcoc-admission"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Admission Gate for a Satoshi Hike v2.0 object."

[lib]
name = "pcoc_admission"
path = "src/lib.rs"

[[bin]]
name = "admission-service"
path = "src/main.rs"

[dependencies]
axum = "0.8"
base64 = "0.22"
hex = "0.4"
secp256k1 = { version = "0.29.1", default-features = false, features = ["std", "alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
toml = "0.8"
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
# v2.0 reference. `linked_measure` is the only caller.
hike = { git = "https://github.com/groundinglab/pcoc", tag = "ref-rust-v2.0.1" }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
