[package]
name = "pcoc-admission"
version = "0.6.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Admission Gate for a Satoshi Hike 2.2 object."

[lib]
name = "pcoc_admission"
path = "src/lib.rs"

[[bin]]
name = "admission-service"
path = "src/main.rs"

[features]
# Testing build. Off in every deploy build. A gate built with it refuses to
# start under a policy whose [index] expected_network is "main"
# (policy::check_build); it serves only a synthetic policy.
testing = []
# Test-only constructors (`AdmissionPolicy::default`, `Config::for_tests`).
# Not a default feature. `cargo build --release` does not enable it, so a
# release build of the service does not compile those constructors.
# `cargo test` enables it through the dev-dependency below.
test-util = []

[dependencies]
axum = "0.8"
base64 = "0.22"
hex = "0.4"
secp256k1 = { version = "0.29.1", default-features = false, features = ["std", "alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
toml = "0.8"
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
# url 2.5.4+ makes ureq's url resolve to idna 1 (GHSA-h97m-ww89-6jmq fix). The lock pins idna_adapter 1.1 (unicode-rs backend) so the build stays on rustc 1.83; idna_adapter 1.2 pulls icu 2.x, which needs a newer rustc.
url = "2.5.4"
# The 2.2 Rust SDK, in-tree at sdk/rust. /v1/health and --version report the
# resolved version (build.rs reads Cargo.lock).
pcoc = { path = "../../sdk/rust/pcoc" }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
# Enables `test-util` only while this package is tested. A normal build,
# including `cargo build --release`, does not turn that feature on.
pcoc-admission = { path = ".", features = ["test-util"] }
