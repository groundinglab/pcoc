[project]
name = "satoshi-hike"
version = "2.2.0"
requires-python = ">=3.11"
dependencies = ["numpy>=2.3.4"]

[project.optional-dependencies]
test = ["pytest>=9.1.1"]

[project.scripts]
satoshi-hike = "impl.cli:main"
gen-candidates = "impl.generate:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["impl"]
