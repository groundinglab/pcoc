# groundinglab admission policy gl-admit-v11. Proposed 2026-10-24. status is active once deployed.
# Supersedes gl-admit-v10. NOT LIVE until Christian says go (pcoc #115).
# Repo path (agreed layout): policy/groundinglab-admission/gl-admit-v11.toml
# Argued in POLICY.md next to this file. Sets SPEC 2.3 section 15.4 levers only.
# Encoding is SPEC 2.3 §15.4 "Policy file encoding". Keys in [levers] are the exact
# lever names. SPEC 2.3 gives no lever a default (D2). An absent key means unset only
# for verify_cap_per_object, verify_cap_per_door_session, and fake_leg_ignore_seconds,
# whose ranges list unset. Any other absent key refuses the whole file, and so do an
# absent policy_id, draw_commitment, or born_height. On a spec-2.3.0 pin the gate
# accepts a policy whose spec is "2.2" or "2.3" (Rule I5/D7). The gate still refuses
# the file if a key names an unknown lever, if a value has the wrong type, or if a
# value is outside the lever's allowed range. With no policy file, or a refused one,
# the gate admits nothing.

policy_id = "gl-admit-v11"
spec      = "2.3"            # Satoshi Hike 2.3, tag spec-2.3.0
status    = "active"

[levers]
# Set explicitly. SPEC 2.3 gives these levers no default.
min_anchored_paths           = 6                  # waypoints, range 2..16
leg_rate_floor               = { p = 1, q = 10 }  # 0.1 legs/s for testing (Christian 24 Oct 2026; #115). Retune after more produces.
# SPEC 2.3 still requires this lever (range 0..6). K=0 tightens; K=6 is the max and still
# refuses a multi-hour-late submit. True disable needs SPEC change — see pcoc #117.
submission_deadline_blocks   = 3                  # K, blocks, range 0..6; withdrawn intent in #117, still required by SPEC 2.3
held_retry_seconds           = 600                # gate-scoped, >= 1
thorough_rounds              = 3                  # D = 18 legs
challenge_lifetime_seconds   = 120
challenge_clock_skew_seconds = 5
result_retention_seconds     = 600

# SPEC gives no default; the policy must set these. Values are the earlier
# `default` profile figures, carried over unchanged.
reverify_max_attempts        = 3
max_held_blocks              = 6
provisional                  = "on"
fast_accept_bound            = 2                  # seconds (SPEC 15.4 encoding: integer ms = round(x*1000))
async_catch_budget           = 22.05              # seconds, at most 3 fractional digits

# Absent means unset for verify_cap_per_object and fake_leg_ignore_seconds. The door-session cap is set.
# verify_cap_per_object       = 1
verify_cap_per_door_session  = 3
# fake_leg_ignore_seconds unset: the fake-leg ignore has no expiry.

[policy_rules]
# Behaviour the SPEC leaves to policy (POLICY.md section 3). Not levers.
expected_network       = "main"                    # P1 integrity
plant_gap              = "record-only"             # P2: d_g is recorded, never compared
friendly_entry_custody = "newest-thorough-accept"  # P3
old_policy_resubmit    = "new-cycle"               # P3
draw_commitment        = "sha256(draw || salt), revealed with the result"
# P5. Not a SPEC §15.4 lever. Heights below this are testing, not production.
# services/bari BORN_HEIGHT must stay equal to this value.
born_height            = 972685
