# groundinglab admission policy gl-admit-v12. In-repo 2026-10-24. Not live on the host.
# Live successor when the ops cutover go lands. Supersedes gl-admit-v11.
# Repo path (agreed layout): policy/groundinglab-admission/gl-admit-v12.toml
# Argued in POLICY.md next to this file. Sets Admission Process §15.4 levers only.
# The public face is the six-doc pack under spec/ (tag spec-2.3.0).
# Encoding is spec/04-Admission_Process.md §15.4 "Policy file encoding".
# Keys in [levers] are the exact lever names. Admission Process gives no lever a default.
# An absent key means unset only for verify_cap_per_object, verify_cap_per_door_session,
# and fake_leg_ignore_seconds, whose ranges list unset. Any other absent lever refuses
# the whole file, and so do an absent policy_id, draw_commitment, or born_height.
# A key that is not a §15.4 lever name refuses the file. SPEC 2.3 defines no
# tip-versus-last-beacon submit deadline, so this file has no such lever.
# With no policy file, or a refused one, the gate admits nothing.

policy_id = "gl-admit-v12"
spec      = "2.3"            # Satoshi Hike 2.3, tag spec-2.3.0, pack under spec/
status    = "active"         # in-repo successor. Not live on the host until an ops cutover go.

[levers]
# Set explicitly. Admission Process gives these levers no default.
min_anchored_paths           = 6                  # waypoints, range 2..16
leg_rate_floor               = { p = 1, q = 10 }  # 0.1 legs/s for testing (Christian 24 Oct 2026; #115). Retune after more produces.
held_retry_seconds           = 600                # gate-scoped, >= 1
thorough_rounds              = 3                  # D = 18 legs
challenge_lifetime_seconds   = 120
challenge_clock_skew_seconds = 5
result_retention_seconds     = 600

# Admission Process gives no default; the policy must set these. Values are the
# gl-admit-v11 figures, carried over unchanged.
reverify_max_attempts        = 3
max_held_blocks              = 6
provisional                  = "on"
fast_accept_bound            = 2                  # seconds (SPEC 15.4 encoding: integer ms = round(x*1000))
async_catch_budget           = 22.05              # seconds, at most 3 fractional digits

# Absent means unset. This file omits verify_cap_per_object and
# fake_leg_ignore_seconds, and it omits verify_cap_per_door_session entirely.
# An absent door-session cap is no session cap. The gate does not fill 3.
# A valid PCOC is judged on merit, not on how many times this door verified.
# verify_cap_per_object       = 1
# fake_leg_ignore_seconds unset: the fake-leg ignore has no expiry.

[policy_rules]
# Behaviour the admission process leaves to policy (POLICY.md section 3). Not levers.
expected_network       = "main"                    # P1 integrity
plant_gap              = "record-only"             # P2: d_g is recorded, never compared
friendly_entry_custody = "newest-thorough-accept"  # P3
old_policy_resubmit    = "new-cycle"               # P3
draw_commitment        = "sha256(draw || salt), revealed with the result"
# Off for testing. A resubmit of a refused (public_key, object, policy_id)
# is measured again and may append a new refuse line. Set true to restore
# the stored-outcome short circuit (no new chain line). Not a §15.4 lever.
# Not part of the policy bind hash, so this flip does not need a new id.
sticky_refuse          = false
# P5. Not an Admission Process §15.4 lever. Heights below this are testing, not production.
# services/bari BORN_HEIGHT must stay equal to this value.
born_height            = 972685
